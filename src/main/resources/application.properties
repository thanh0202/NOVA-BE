# NOVA: Cấu hình Spring Boot: HTTP, JDBC schema shop, SMTP, CORS, OTP và Cloudinary; bí mật đọc từ biến môi trường.
# Tên ứng dụng và địa chỉ lắng nghe. Bản triển khai dùng localhost sau Caddy.
spring.application.name=nova
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=${NOVA_FORWARD_HEADERS:none}
server.error.include-message=never

# Tương thích CSDL NOVA hiện có, dùng schema shop.
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/nova?currentSchema=shop,public}
spring.datasource.username=${DB_USERNAME:nova}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-init-sql=SET search_path TO shop,public
# SQL chỉ được người triển khai chạy chủ động, không tự sửa Neon khi ứng dụng bật.
spring.sql.init.mode=never

# DTO từ chối trường lạ, ví dụ client không thể tự gửi role/status khi sửa hồ sơ.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Khóa dùng ký OTP được cấp riêng qua biến môi trường NOVA_OTP_KEY.
nova.otp-key=${NOVA_OTP_KEY:}
nova.cors-origins=${NOVA_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
nova.mail-from=${NOVA_SMTP_FROM:}

# SMTP gửi mã xác thực. Các giá trị thật chỉ điền trong .env / môi trường chạy.
spring.mail.host=${NOVA_SMTP_HOST:}
spring.mail.port=${NOVA_SMTP_PORT:587}
spring.mail.username=${NOVA_SMTP_USER:}
spring.mail.password=${NOVA_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${NOVA_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${NOVA_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Tải ảnh từ Android; API secret chỉ được đọc trong tiến trình backend.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB
spring.servlet.multipart.file-size-threshold=0
nova.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
nova.cloudinary.api-key=${CLOUDINARY_API_KEY:}
nova.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
